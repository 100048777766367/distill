name: One-Shot Genesis Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write

jobs:
  run-genesis:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn nút mạng
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Kích hoạt Hạt Nhân Tự Phôi Thai
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      - name: Lưu vết toàn bộ cơ quan vừa tự đẻ lên Git
        run: |
          git config --global user.name "Distill-Foundry-Bot"
          git config --global user.email "bot@distill.foundry"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          # Stage toàn bộ những gì kernel.py vừa tự đẻ ra
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🔮 [One-Shot Genesis] Tự đẻ toàn bộ thể xác & Xuất xưởng mô hình #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Mọi cơ quan đã hoàn thiện, không có biến thiên mới."
          fi
